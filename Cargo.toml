[package]
name = "escuta"
version = "0.1.0"
edition = "2024"
description = "Transcrição local do áudio do computador para estudo"

[features]
default = ["vulkan"]
vulkan = ["whisper-rs/vulkan"]
screenshot = []

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "clipboard", "glow", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
whisper-rs = "0.16"

[profile.release]
lto = "thin"
